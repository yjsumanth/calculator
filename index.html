<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0d0d0d" id="theme-color-meta" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="auto">
  <div class="app">
    <!-- Top icon bar — history (left) + settings (right), floating above display -->
    <header class="topbar">
      <button class="icon-btn" id="open-history" aria-label="History">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <polyline points="12 7 12 12 15 14"></polyline>
        </svg>
      </button>
      <button class="icon-btn" id="open-settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Display — outlined rounded rectangle (expression only) -->
    <section class="display" aria-live="polite">
      <div class="display__expression" id="expression"></div>
    </section>

    <!-- Result — sits OUTSIDE the display frame, below it -->
    <div class="result" id="result" aria-live="polite">0</div>

    <!-- Number-in-words (shown after pressing =) with copy button -->
    <div class="words-row" id="words-row">
      <span class="words" id="words" aria-live="polite"></span>
      <button class="words-copy" id="words-copy" aria-label="Copy words" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>

    <!-- Button grid — matches desktop layout exactly -->
    <section class="keypad" role="group" aria-label="Calculator keypad">
      <!-- Row 1: DEL | % | CE | Clear  (all light gray "util") -->
      <button class="key key--fn" data-action="backspace">DEL</button>
      <button class="key key--fn" data-action="percent">%</button>
      <button class="key key--fn" data-action="ce">CE</button>
      <button class="key key--fn" data-action="clear">Clear</button>

      <!-- Row 2: 7 | 8 | 9 | ÷ -->
      <button class="key key--num" data-digit="7">7</button>
      <button class="key key--num" data-digit="8">8</button>
      <button class="key key--num" data-digit="9">9</button>
      <button class="key key--op" data-op="÷">÷</button>

      <!-- Row 3: 4 | 5 | 6 | × -->
      <button class="key key--num" data-digit="4">4</button>
      <button class="key key--num" data-digit="5">5</button>
      <button class="key key--num" data-digit="6">6</button>
      <button class="key key--op" data-op="×">×</button>

      <!-- Row 4: 1 | 2 | 3 | − -->
      <button class="key key--num" data-digit="1">1</button>
      <button class="key key--num" data-digit="2">2</button>
      <button class="key key--num" data-digit="3">3</button>
      <button class="key key--op" data-op="−">−</button>

      <!-- Row 5: 0 | . | = | + -->
      <button class="key key--num" data-digit="0">0</button>
      <button class="key key--num" data-action="decimal">.</button>
      <button class="key key--op" data-action="equals">=</button>
      <button class="key key--op" data-op="+">+</button>
    </section>
  </div>

  <!-- History sheet -->
  <div class="sheet-backdrop" id="history-backdrop"></div>
  <aside class="sheet" id="history-sheet" aria-hidden="true">
    <header class="sheet__head">
      <div class="sheet__grabber"></div>
      <h2 class="sheet__title">History</h2>
      <button class="sheet__action" id="clear-history">Clear all</button>
    </header>
    <div class="history-list" id="history-list">
      <p class="history-empty" id="history-empty">No calculations yet.</p>
    </div>
  </aside>

  <!-- Settings sheet -->
  <div class="sheet-backdrop" id="settings-backdrop"></div>
  <aside class="sheet" id="settings-sheet" aria-hidden="true">
    <header class="sheet__head">
      <div class="sheet__grabber"></div>
      <h2 class="sheet__title">Settings</h2>
      <button class="sheet__close" id="close-settings" aria-label="Close">✕</button>
    </header>

    <div class="settings-section">
      <h3 class="settings-label">Theme</h3>
      <div class="seg-control" role="radiogroup" aria-label="Theme">
        <button class="seg" data-theme="light" role="radio">Light</button>
        <button class="seg" data-theme="dark" role="radio">Dark</button>
        <button class="seg" data-theme="auto" role="radio">Auto</button>
      </div>
    </div>

    <div class="settings-section">
      <h3 class="settings-label">Data</h3>
      <button class="settings-row" id="clear-history-2">
        <span>Clear calculation history</span>
        <span class="settings-row__chev">›</span>
      </button>
    </div>

    <div class="settings-footer">
      <span>Calculator · v0.3</span>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
